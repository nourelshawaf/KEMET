name: Firmware Bug
description: Report a bug in the ESP32 or Pico firmware
labels: ["bug", "firmware"]
body:
  - type: dropdown
    id: board
    attributes:
      label: Affected board
      options:
        - Raspberry Pi Pico
        - ESP32
        - Both
    validations:
      required: true
  - type: input
    id: firmware_version
    attributes:
      label: Firmware version / commit
      placeholder: "e.g. git short hash or phase name"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: serial
    attributes:
      label: Serial monitor output (if relevant)
